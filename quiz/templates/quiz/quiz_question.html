{% extends 'quiz/base.html' %}
{% block content %}

<div class="container py-5">
    <div class="card">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between">
                <span>Pytanie {{ numer }}/{{ liczba_pytan }}</span>
                <span>Quiz: <strong id="qt">{{ pozostaly_czas_quizu }}</strong>s | Pytanie: <strong id="pt">{{ pozostaly_czas_pytania }}</strong>s</span>
            
            </div>
            <h3 class="mt-3">{{ pytanie.text }}</h3>
            
            <form method="post" id="answerForm">
                {% csrf_token %}
                
                <input type="hidden" name="timeout" id="timeout" value="0">
                
                {% for odpowiedz in pytanie.answer_set.all %}
                
                <div class="form-check my-3">
                    <input class="form-check-input" type="radio" name="odpowiedz" value="{{ odpowiedz.id }}" id="o{{ odpowiedz.id }}">
                    <label class="form-check-label" for="o{{ odpowiedz.id }}">{{ odpowiedz.text }}</label>
                                    
                </div>{% endfor %}<button class="btn btn-primary">Dalej</button>
            </form>
        </div>
    </div>
</div>

<script>
    let q = {{ pozostaly_czas_quizu }};
    let p = {{ pozostaly_czas_pytania }};

    const t = setInterval(() => {
        q--;
        p--;
        document.getElementById('qt').textContent = Math.max(0, q);
        document.getElementById('pt').textContent = Math.max(0, p);
        if (q <= 0 || p <= 0) {
            clearInterval(t);
            document.getElementById('timeout').value = '1';
            document.getElementById('answerForm').submit();
        }
    }, 1000);
</script>

{% endblock %}
