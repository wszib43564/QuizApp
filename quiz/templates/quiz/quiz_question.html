{% extends 'quiz/base.html' %}
{% block content %}

<div class="container py-5">
    <div class="card">
        <div class="card-body p-4">
            <p>Pytanie {{ numer }} z {{ liczba_pytan }}</p>
            
            <h3>{{ pytanie.text }}</h3>
            
            <form method="post">
                {% csrf_token %}{% for odpowiedz in pytanie.answer_set.all %}
                
                <div class="form-check my-3">
                    <input class="form-check-input" type="radio" name="odpowiedz" value="{{ odpowiedz.id }}" id="o{{ odpowiedz.id }}" required>
                    <label class="form-check-label" for="o{{ odpowiedz.id }}">{{ odpowiedz.text }}</label>
                </div>
                
                {% endfor %}
                
                <button class="btn btn-primary">Dalej</button>
            
            </form>
        </div>
    </div>
</div>
{% endblock %}
