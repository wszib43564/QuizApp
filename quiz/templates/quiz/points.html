{% extends 'quiz/base.html' %}
{% block content %}

<div class="container py-5">
    <h2>Punkty</h2>
    
    <div class="card mb-4">
        <div class="card-body">
            <h3>{{ profil.points }} pkt</h3>
        </div></div><div class="card">
            
            <div class="card-body">
                <h4>Historia transakcji</h4>
                {% for t in transakcje %}
                
                <div class="border-bottom py-2">
                    <strong>{{ t.points }} pkt</strong> — {{ t.description }} 
                    <small class="text-secondary">{{ t.created_at|date:"d.m.Y H:i" }}</small>
                </div>{% empty %}
                
                <p>Brak transakcji.</p>
                
                {% endfor %}
            </div>
        </div>
    </div>
{% endblock %}
