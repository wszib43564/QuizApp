{% extends 'quiz/base.html' %}
{% block content %}

<div class="container py-5">
    <h2>Quizy</h2>
    
    <div class="row g-3">
        {% for quiz in quizy %}
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    
                    <h4>{{ quiz.title }}</h4>
                    
                    <p>{{ quiz.description }}</p>
                    
                    <form method="post" action="{% url 'rozpocznij_quiz' quiz.id %}">
                        {% csrf_token %}
                        
                        <button class="btn btn-primary">Rozpocznij</button>
                    </form>
                </div>
            </div>
        </div>
        {% empty %}
        <p>Brak quizów.</p>
        
        {% endfor %}
    </div>
</div>

{% endblock %}
