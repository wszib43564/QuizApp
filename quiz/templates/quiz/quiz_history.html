{% extends 'quiz/base.html' %}
{% block content %}

<div class="container py-5">
    <h2>Historia quizów</h2>
    <div class="card">
        <div class="card-body">
            {% for p in podejscia %}
            <div class="border-bottom py-2">

                <strong>{{ p.quiz.title }}</strong> — {% if p.score != None %}{{ p.score }}{% else %}{{ p.point_score }}{% endif %} pkt — {{ p.completed_at|date:"d.m.Y H:i" }}
            
            </div>{% empty %}
            
            <p>Brak podejść.</p>
            
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
